output_dir: "docs"
default_timezone: "America/New_York"

teams:
  # --- Bond Sports (old league) — historical record. docs/orcas-winter2026-6a.ics
  # etc. were the frozen final Winter 2026 feeds; they are NOT touched by these
  # entries (no slug/alias below matches them) and never will be again.
  #
  # - name: "Orcas"                        | slug: "orcas-winter2026-6a"
  # - name: "Alligator Skinners"           | slug: "alligator-skinners-winter-2026-d3"
  # - name: "Grocery Sticks"               | slug: "grocery-sticks-winter-2026-d5a"

  # --- Bond Sports (old league) — season-agnostic feeds. Each team below merges
  # EVERY season+stage (regular season AND playoffs) it plays in program 12070
  # into ONE feed, so the subscription URL never changes again. `program_id`
  # auto-discovers new seasons/stages each run (cached in docs/_state/<slug>.json);
  # `seasons:` lists Winter 2026 explicitly too, as a fallback in case discovery
  # ever breaks (Winter's Playoffs stage is discovered automatically, not listed
  # here). Team ids are resolved by matching `name` against each stage's
  # schedule, so they no longer need to be tracked/updated by hand each season.
  # The old fall2026-slug feeds are kept as `aliases` (live copies of this same
  # merged feed) so anyone who already subscribed to them keeps getting updates.
  - name: "Orcas"
    provider: "bondsports"
    slug: "orcas"
    aliases: ["orcas-fall2026-6a"]
    program_id: 12070
    seasons:
      - league_name: "Winter 2026 Division 6A"
        competition_id: "4fd5e832-5d86-400a-af3f-7a01c20d1e4e"
        stage_id: 160

  - name: "Alligator Skinners"
    provider: "bondsports"
    slug: "alligator-skinners"
    aliases: ["alligator-skinners-fall2026-d3"]
    program_id: 12070
    seasons:
      - league_name: "Winter 2026 Division 3"
        competition_id: "180251ce-9fbc-4153-b7f6-ce3530a2c7f9"
        stage_id: 153

  - name: "Grocery Sticks"
    provider: "bondsports"
    slug: "grocery-sticks"
    aliases: ["grocery-sticks-fall2026-d5a"]
    program_id: 12070
    seasons:
      - league_name: "Winter 2026 Division 5A"
        competition_id: "00d2c916-8370-463c-8d83-01c9ce2de443"
        stage_id: 158

  # --- TimeToScore / Black Bear (new league: Foundry Ice Land) — season-agnostic
  # feeds. `league_widget_url` is any PUBLIC schedule-widget page for this league
  # (season/stat_class in its query string don't matter -- they get swapped per
  # discovered season, always at stat_class=7 "Adult Total", which already merges
  # regular season + playoffs in one call). generate_ics.py loads it in a real
  # headless browser and captures the get_schedule/get_standings/get_leagues
  # responses the page's own official widget code fetches -- no signed URL to
  # paste in or refresh by hand, ever.
  #
  # Only the CURRENT season is auto-included on first discovery; seasons before
  # that are deliberately NOT backfilled (a differently-rostered team can share
  # the exact same name in an older season here -- confirmed for "Brewzers": same
  # team_id, Fall 2025, a full year before this team joined). Every season from
  # here forward is picked up automatically with no config change. To include a
  # specific older season anyway, add it explicitly under `seasons:` (same
  # fallback pattern Bond Sports uses).
  - name: "Brewzers"
    provider: "timetoscore"
    slug: "brewzers"
    aliases: ["brewzers-fall2026-adultc"]
    league_widget_url: "https://foundryadulthockey.com/iceland-schedule-widget/?season=177&stat_class=5"

  - name: "The Owls"
    provider: "timetoscore"
    slug: "the-owls"
    aliases: ["the-owls-fall2026-adultab"]
    league_widget_url: "https://foundryadulthockey.com/iceland-schedule-widget/?season=177&stat_class=5"
