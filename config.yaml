  # --- TimeToScore / Black Bear (new league: Foundry Ice Land) ---
  # widget_url is the league's PUBLIC schedule-widget page (shared by any team in
  # the same league/season/stat_class). generate_ics.py loads it in a real headless
  # browser and captures the get_schedule/get_standings responses the page's own
  # official widget code fetches -- no signed URL to paste in or refresh by hand.
  - name: "Brewzers"
    provider: "timetoscore"
    slug: "brewzers-fall2026-adultc"
    league_name: "Foundry Ice Land — Adult C"
    widget_url: "https://foundryadulthockey.com/iceland-schedule-widget/?season=177&stat_class=5"
    my_team_ids: [11911]
    my_team_names: ["Brewzers"]

  - name: "The Owls"
