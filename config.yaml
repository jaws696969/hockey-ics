output_dir: "docs"
default_timezone: "America/New_York"

teams:
  # --- Bond Sports (old league) — Winter 2026 season is OVER (completed June 2026).
  # These entries are intentionally removed from active generation so the final
  # .ics files below are preserved as a permanent record of that season and never
  # get overwritten. Re-add an entry here (with these exact slugs) if you ever
  # need to regenerate them.
  #
  # - name: "Orcas"                        | slug: "orcas-winter2026-6a"
  # - name: "Alligator Skinners"           | slug: "alligator-skinners-winter-2026-d3"
  # - name: "Grocery Sticks"               | slug: "grocery-sticks-winter-2026-d5a"

  # --- Bond Sports (old league), Fall 2026 season — kept running for friends
  # still on the old league. Fall 2026 restructured to ONE shared stage covering
  # every division (unlike Winter, which had a separate stage per division), so
  # all three teams below share the same api_url/standings_api_url; the script
  # already dedupes identical URLs within a run. Team IDs also changed from
  # Winter (re-registered per season) -- pulled fresh from the Fall game-scores
  # response, not reused from the old config.
  - name: "Orcas"
    provider: "bondsports"
    slug: "orcas-fall2026-6a"
    league_name: "Fall 2026 Division 6A"
    api_url: "https://api.bondsports.co/v4/competitions/67561257-dca0-4770-b298-559f07ea02ed/stages/1156/game-scores"
    standings_api_url: "https://api.bondsports.co/v4/competitions/67561257-dca0-4770-b298-559f07ea02ed/stages/1156/standings"
    my_team_ids: [7384]
    my_team_names: ["Orcas"]

  - name: "Alligator Skinners"
